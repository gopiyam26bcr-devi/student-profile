
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Profile Management System</h1>
    <p>Manage Student Information Easily</p>
</header>

<div class="container">

    <h2>Add Student Profile</h2>

    <form id="studentForm">
        <input type="text" id="name" placeholder="Student Name" required>

        <input type="text" id="roll" placeholder="Roll Number" required>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="text" id="department" placeholder="Department" required>

        <input type="number" id="year" placeholder="Year" min="1" max="6" required>

        <input type="text" id="phone" placeholder="Phone Number" required>

        <button type="submit" id="submitBtn">Add Student</button>
    </form>

    <h2>Student Details</h2>

    <input type="text" id="search"
           placeholder="Search by name or roll number...">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>
        </table>
    </div>

</div>

<footer>
    <p>© 2026 Student Profile Management System</p>
</footer>

<script src="script.js"></script>

</body>
</html>
